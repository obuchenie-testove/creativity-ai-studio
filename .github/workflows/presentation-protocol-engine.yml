name: Presentation protocol engine

on:
  push:
    branches: [main]
    paths: ["presentation-protocol-engine/**", ".github/workflows/presentation-protocol-engine.yml"]
    tags: ["bank-v*"]
  pull_request:
    paths: ["presentation-protocol-engine/**", ".github/workflows/presentation-protocol-engine.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: presentation-protocol-engine

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Manifest is in sync with protocol files
        run: python scripts/sync_manifest.py --check
      - name: BUNDLE.md is up to date
        run: python scripts/build_bundle.py --check
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  release:
    # Push a tag bank-v<version> (matching manifest.json "version") to publish a bank release.
    if: startsWith(github.ref, 'refs/tags/bank-v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches manifest version
        run: |
          want="bank-v$(python -c 'import json;print(json.load(open("protocol-bank/manifest.json"))["version"])')"
          test "$want" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} != $want"; exit 1; }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Gemini skill package
        run: python scripts/build_gemini_skill.py
      - name: Publish release with BUNDLE.md and the Gemini skill
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" protocol-bank/BUNDLE.md dist/creativity-presentation-orchestrator-gemini.zip \
            --title "Protocol bank ${GITHUB_REF_NAME}" \
            --notes "Pinned bundle URL: https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@${GITHUB_REF_NAME}/presentation-protocol-engine/protocol-bank/BUNDLE.md"
